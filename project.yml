name: Stratum
options:
  bundleIdPrefix: app.stratum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configFiles:
  Debug: Config/Debug.xcconfig

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Stratum:
    type: application
    platform: macOS
    sources:
      - path: Stratum
    resources:
      - path: Stratum/Resources
        optional: true
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    info:
      path: Stratum/Info.plist
      properties:
        CFBundleDisplayName: Stratum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Aby Saji. MIT Licensed."
        SUFeedURL: "https://github.com/AbyAbyss/stratum_file_manager/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        NSDesktopFolderUsageDescription: "Stratum accesses your Desktop to browse and manage your files."
        NSDocumentsFolderUsageDescription: "Stratum accesses your Documents to browse and manage your files."
        NSDownloadsFolderUsageDescription: "Stratum accesses your Downloads to browse and manage your files."
        NSAppleEventsUsageDescription: "Stratum uses Apple Events to open folders in Terminal and reveal items."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stratum.filemanager
        PRODUCT_NAME: Stratum
        # The app version: shown in Settings -> About and used for releases.
        # Bump it before releasing (see docs/RELEASING.md).
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "1"
        # The EdDSA public key that update archives are checked against. Paste the key printed by
        # Sparkle's generate_keys here (docs/RELEASING.md). While empty, the build has no updater.
        SPARKLE_PUBLIC_KEY: "fHu+dsMu8HEriacv3AlFWYjU5qDvFM0AGGtwCrFI3PY="
        # The hardened runtime is switched on by the release workflow for signed builds only: it
        # enforces library validation, which stops an ad-hoc build loading the embedded Sparkle.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  StratumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StratumTests
    dependencies:
      - target: Stratum
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stratum.filemanager.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stratum.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stratum"
        BUNDLE_LOADER: "$(TEST_HOST)"
